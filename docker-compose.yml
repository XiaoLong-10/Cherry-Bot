version: '3.8'

services:
  cherry-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cherry_bot_app
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./economy.db:/app/economy.db
      - ./scratch:/app/scratch
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
